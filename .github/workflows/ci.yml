name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  no-real-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block data files outside synthetic folders
        run: |
          found=$(git ls-files \
            | grep -Ei '\.(xlsx|xls|csv|xml|zip|pdf|jpg|jpeg|png|heic)$' \
            | grep -Ev '^(supabase/seed/|tests/fixtures/|public/|docs/img/)' || true)
          if [ -n "$found" ]; then
            echo "Data files outside synthetic folders:"
            echo "$found"
            exit 1
          fi

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify

  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase test db
