name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  no-real-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Block data files outside synthetic folders
        run: |
          found=$(git ls-files \
            | grep -Ei '\.(xlsx|xls|csv|xml|zip|pdf|jpg|jpeg|png|heic)$' \
            | grep -Ev '^(supabase/seed/|tests/fixtures/|public/|docs/img/)' || true)
          if [ -n "$found" ]; then
            echo "Data files outside synthetic folders:"
            echo "$found"
            exit 1
          fi

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify

  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          # Same version as the "supabase" devDependency in package.json; a fixed
          # version also avoids the GitHub API rate limit hit when resolving "latest".
          version: 3.2.0
      # pgTAP only needs Postgres, so every other service is skipped. The runner
      # sometimes reports the database port as already in use, so retry once.
      - name: Start Supabase (database only)
        run: |
          EXCLUDE=gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          if ! supabase start -x "$EXCLUDE"; then
            echo "::warning::supabase start failed; stopping and retrying once"
            supabase stop --no-backup || true
            sleep 5
            supabase start -x "$EXCLUDE"
          fi
      - run: supabase test db
